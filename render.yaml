services:
  - type: web
    name: pokemon-tcg-pricing
    env: python
    buildCommand: |
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JUSTTCG_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
